<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="nhBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A5F" />
      <stop offset="50%" stop-color="#0F294A" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <linearGradient id="nhPillar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E0F2FE" />
    </linearGradient>

    <linearGradient id="nhPulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <radialGradient id="nhGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0" />
    </radialGradient>

    <filter id="nhShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0A1628" flood-opacity="0.3" />
    </filter>

    <filter id="nhPulseGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#38BDF8" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Squircle Base Container -->
  <rect width="512" height="512" rx="118" fill="url(#nhBg)" />

  <!-- Subtle Border Reflection -->
  <rect x="6" y="6" width="500" height="500" rx="112" fill="none" stroke="#38BDF8" stroke-opacity="0.2" stroke-width="4" />

  <!-- Center Ambient Light -->
  <circle cx="256" cy="256" r="180" fill="url(#nhGlow)" />

  <!-- Geometric Symbol: The 'H' + Medical Cross + Realtime Vital Signal -->
  <g filter="url(#nhShadow)">
    <!-- Left Pillar of 'H' -->
    <rect x="116" y="116" width="68" height="280" rx="34" fill="url(#nhPillar)" />

    <!-- Right Pillar of 'H' -->
    <rect x="328" y="116" width="68" height="280" rx="34" fill="url(#nhPillar)" />

    <!-- Central Medical Cross Horizontal Bar -->
    <rect x="150" y="222" width="212" height="68" rx="34" fill="url(#nhPillar)" />

    <!-- Central Medical Cross Vertical Core -->
    <rect x="222" y="150" width="68" height="212" rx="34" fill="url(#nhPillar)" />

    <!-- Vital Pulse (ECG Heartbeat) Inset -->
    <g filter="url(#nhPulseGlow)">
      <path d="M150 256 L196 256 L220 200 L256 320 L288 174 L314 256 L362 256" 
            fill="none" 
            stroke="url(#nhPulse)" 
            stroke-width="22" 
            stroke-linecap="round" 
            stroke-linejoin="round" />
      
      <!-- Vital Real-Time Ping Node -->
      <circle cx="288" cy="174" r="10" fill="#FFFFFF" />
      <circle cx="288" cy="174" r="5" fill="#10B981" />
    </g>
  </g>
</svg>